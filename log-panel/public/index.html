<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111318">
  <title>Contra City — Логи игры</title>
  <meta name="description" content="История событий игроков Contra City">
  <link rel="stylesheet" href="/styles.css?v=46">
  <script src="/config.js" defer></script>
  <script src="/app.js?v=46" defer></script>
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <section id="login-view" class="login-view">
    <div class="login-card">
      <div class="brand brand-login">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span><b>CONTRA CITY</b><small>Логи игры</small></span>
      </div>
      <h1>Вход</h1>
      <form id="login-form" autocomplete="on">
        <label>Логин<input id="login-input" name="username" autocomplete="username" required maxlength="64"></label>
        <label>Пароль<input id="password-input" name="password" type="password" autocomplete="current-password" required minlength="12"></label>
        <button class="button primary wide" type="submit">Войти</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </div>
  </section>

  <div id="app-view" class="app-view hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span><b>CONTRA CITY</b><small>Логи игры</small></span>
      </div>
      <nav class="main-nav" aria-label="Навигация">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/></svg></span><span>Главная</span></button>
        <button class="nav-item" data-view="events"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>Все события</span><em id="nav-event-count">0</em></button>
        <button class="nav-item" data-filter-categories="session" data-page-title="Входы и выходы"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6M13 8l4 4-4 4M8 12h13"/></svg></span><span>Входы и выходы</span></button>
        <button class="nav-item" data-filter-categories="economy,weapons,workshop,clothes,taunts,enhancers,abilities,inventory" data-page-title="Покупки и монеты"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l3 12h11l2-8H6M9 20h.01M18 20h.01"/></svg></span><span>Покупки и монеты</span></button>
        <button class="nav-item" data-filter-categories="chat" data-page-title="Чат"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4Z"/></svg></span><span>Чат</span></button>
        <button class="nav-item" data-filter-categories="moderation" data-page-title="Жалобы и модерация"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 20h18ZM12 9v5M12 17h.01"/></svg></span><span>Жалобы и модерация</span></button>
        <button class="nav-item" data-filter-categories="clan" data-page-title="Кланы"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-4M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8"/></svg></span><span>Кланы</span></button>
        <button class="nav-item" data-filter-categories="progress" data-page-title="Задания и опыт"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span><span>Задания и опыт</span></button>
        <button class="nav-item danger-nav" aria-label="Подозрительная активность" data-suspicious="true"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 20h18ZM12 9v5M12 17h.01"/></svg></span><span>Подозрительное</span><em id="nav-risk-count">0</em></button>
        <button class="nav-item owner-only hidden" data-view="admins"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/></svg></span><span>Администраторы</span></button>
      </nav>
      <div class="sidebar-footer">
        <span id="sync-time" class="sync-time">Ещё не обновлено</span>
        <button id="logout-button" class="profile-button">
          <span class="avatar" id="admin-avatar">A</span>
          <span><b id="admin-name">Администратор</b><small id="admin-role">—</small></span>
          <span>Выйти</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" aria-label="Открыть меню">☰</button>
        <h1 id="page-title">Главная</h1>
        <div class="topbar-actions">
          <button id="refresh-button" class="button secondary" title="Обновить">Обновить</button>
          <button id="export-button" class="button secondary export-capability">Скачать логи</button>
        </div>
      </header>

      <div id="dashboard-view" class="content-view">
        <section id="stat-grid" class="stat-grid" aria-label="Статистика"></section>

        <section class="overview-grid">
          <article class="panel activity-panel">
            <div class="panel-heading">
              <h2>Активность игроков</h2>
              <select id="stats-period" aria-label="Период">
                <option value="1h">1 час</option>
                <option value="24h" selected>24 часа</option>
                <option value="7d">7 дней</option>
                <option value="30d">30 дней</option>
              </select>
            </div>
            <div id="activity-chart" class="activity-chart" aria-label="Активность игроков"></div>
            <div id="category-legend" class="category-legend"></div>
          </article>

          <article class="panel risk-panel">
            <div class="panel-heading">
              <h2>Подозрительные события</h2>
              <button class="text-button" data-suspicious="true">Показать все</button>
            </div>
            <div id="risk-list" class="risk-list"></div>
          </article>
        </section>

        <section class="panel clan-strip-panel">
          <div class="panel-heading"><h2>Кланы</h2><button class="text-button" data-filter-category="clan">Все события кланов</button></div>
          <div id="clan-strip" class="clan-strip"></div>
        </section>

        <section class="panel latest-panel">
          <div class="panel-heading"><h2>Последние события</h2><span id="new-events-badge" class="new-events-badge hidden">0 новых</span></div>
          <div id="latest-events" class="event-list compact"></div>
        </section>
      </div>

      <div id="events-view" class="content-view hidden">
        <section class="event-toolbar">
          <label class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="Ник, ID игрока, клан или событие" autocomplete="off"></label>
          <button id="filter-button" class="button secondary"><span>Фильтры</span><em id="filter-count" class="filter-count hidden">0</em></button>
          <form id="player-lookup" class="player-lookup"><input name="playerId" type="number" min="1" step="1" required placeholder="ID игрока" aria-label="ID игрока"><button type="submit" class="button secondary">Открыть игрока</button></form>
        </section>
        <div class="event-summary-line"><span>Найдено: <b id="event-total">0</b></span><span id="active-filter-label">Все события</span></div>
        <div class="events-scroll"><div class="event-table-heading" aria-hidden="true"><span>Время</span><span>Игрок</span><span>Событие</span><span>Описание</span><span>Статус</span></div><section id="event-list" class="event-list" aria-label="Журнал событий"></section></div>
        <nav id="pagination" class="pagination" aria-label="Страницы"></nav>
      </div>

      <div id="admins-view" class="content-view hidden">
        <section class="admin-layout">
          <article class="panel">
            <div class="panel-heading"><h2>Администраторы</h2></div>
            <div id="admin-list" class="admin-list"></div>
          </article>
          <article class="panel admin-form-panel">
            <h2>Добавить администратора</h2>
            <form id="admin-form">
              <label>Логин<input name="login" required maxlength="64"></label>
              <label>Имя<input name="displayName" required maxlength="80"></label>
              <label>Роль<select name="role"><option value="head_admin">Главный администратор</option><option value="admin">Администратор</option><option value="moderator">Модератор</option><option value="viewer">Только просмотр</option></select></label>
              <label>Пароль<input name="password" type="password" minlength="12" required></label>
              <button class="button primary wide" type="submit">Добавить</button>
            </form>
          </article>
        </section>
      </div>
    </main>
  </div>

  <aside id="filter-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header"><h2>Фильтры</h2><button class="icon-button drawer-close" aria-label="Закрыть">×</button></div>
    <form id="filter-form">
      <label>IP-адрес<input name="ipAddress" maxlength="128" placeholder="Например, 203.0.113.10"></label>
      <div class="two-columns"><label>Город<input name="city" maxlength="120"></label><label>Страна<input name="countryCode" maxlength="8" placeholder="RU"></label></div>
      <label>Источник<select name="source"><option value="">Любой источник</option><option value="launcher_session">Лаунчер</option><option value="web_session">Веб-сессия</option><option value="login_link">Ссылка входа</option><option value="game_api_login">Вход игрового клиента</option><option value="game_api">Игровой API</option><option value="battle_server">Battle server</option><option value="battle_server_security">Защита battle server</option></select></label>
      <label>Период<select name="period"><option value="">Любое время</option><option value="1h">Последний час</option><option value="24h">24 часа</option><option value="7d">7 дней</option><option value="30d">30 дней</option></select></label>
      <div class="two-columns"><label>С даты<input name="dateFrom" type="datetime-local"></label><label>По дату<input name="dateTo" type="datetime-local"></label></div>
      <label>Категория<select name="category" id="filter-category"><option value="">Все категории</option></select></label>
      <label>Событие<select name="eventType" id="filter-event-type"><option value="">Все события</option></select></label>
      <label>Важность<select name="severity"><option value="">Любая</option><option value="info">Обычное</option><option value="notice">Важное</option><option value="warning">Предупреждение</option><option value="critical">Критическое</option></select></label>
      <label>Проверка<select name="reviewStatus"><option value="">Любой статус</option><option value="unchecked">Не проверено</option><option value="checked">Проверено</option><option value="suspicious">Подозрительно</option><option value="violation">Нарушение</option></select></label>
      <label class="check-line"><input name="suspicious" type="checkbox"><span>Только подозрительные</span></label>
      <div class="drawer-actions"><button type="button" id="reset-filters" class="button ghost">Сбросить</button><button type="submit" class="button primary">Применить</button></div>
    </form>
  </aside>
  <div id="drawer-backdrop" class="backdrop hidden"></div>

  <dialog id="detail-modal" class="detail-modal"><div id="detail-content"></div></dialog>
</body>
</html>
